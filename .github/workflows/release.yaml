name: release

# Package the Helm chart + push it to GHCR (OCI) on every push to main and on tags.
# The Krateo CompositionDefinition installs from oci://ghcr.io/<owner>/hyperdx-observability.
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # Whether this run is a release, and of which version. A `v*` tag releases the version it names (the tag without
  # its `v`), which must be chart/Chart.yaml's; a push to main releases nothing and behaves as before.
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.r.outputs.release }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve the release and its version
        id: r
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^version:[[:space:]]*//p' chart/Chart.yaml | tr -d "\"' ")"
          declared="${declared%%$'\n'*}"
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            [ "$declared" = "$version" ] \
              || { echo "::error::tag ${REF_NAME} releases ${version}, but chart/Chart.yaml says ${declared}"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            version="$declared"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # krateo-blueprints/charts PUBLISHING.md rule 12: a release runs this repository's preflight before it publishes
  # anything. The shared job first refuses a version that is not a plain X.Y.Z (rule 13's pattern), then runs
  # hack/release-preflight if there is one. Only the tag run is a release; a push to main skips it.
  release-preflight:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    uses: krateo-blueprints/charts/.github/workflows/release-preflight.yaml@70095ab05f1c5dc6c8dd39d0b1fdbbc7382a841c # 1.4.3
    permissions:
      contents: read
    with:
      version: ${{ needs.resolve.outputs.version }}

  package-push:
    name: Package and push chart
    needs:
      - resolve
      - release-preflight
    # A main push skips release-preflight, and that must not stop it; a refused or cancelled preflight must. The
    # results are enumerated, because "not failure" would also let a cancelled preflight through.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.release-preflight.result == 'success' || needs.release-preflight.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint
        run: helm lint chart

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      # krateo-blueprints/charts PUBLISHING.md rule 14: charts are pushed through the organisation's chart-push
      # action, whose push.sh retries GHCR's tag read-after-write race (and only that) onto the same digest. Locate
      # mode: it outputs push.sh's path, and the next step runs it once per chart.
      - name: Locate the shared chart push
        id: chart-push
        uses: krateo-platformops/.github/.github/actions/chart-push@e1d3e99215e80ae56eca4a67e9e061b2c73168b8 # 1.0.0

      - name: Package + push
        env:
          CHART_PUSH: ${{ steps.chart-push.outputs.path }}
          # push.sh reads the manifest back with these, after the registry login above.
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          helm package chart --destination /tmp/dist
          # push.sh takes one archive per call, so the glob is looped over.
          for tgz in /tmp/dist/hyperdx-observability-*.tgz; do
            bash "${CHART_PUSH}" "$tgz" oci://ghcr.io/${{ github.repository_owner }}
          done
